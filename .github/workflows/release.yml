name: Release

# Push a tag like v1.0.0 to build the binaries and publish a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04  # older glibc -> binary also runs on newer Kali/Debian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Linux binary
        run: |
          pyinstaller --noconfirm CytadelExposure-linux.spec
          mv dist/CytadelExposure dist/CytadelExposure-linux-x86_64
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CytadelExposure-linux-x86_64
          fail_on_unmatched_files: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon assets/app.ico --add-data "assets;assets" --name CytadelExposure --collect-submodules reportlab main.py
          Rename-Item dist/CytadelExposure.exe CytadelExposure-windows-x86_64.exe
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CytadelExposure-windows-x86_64.exe
          fail_on_unmatched_files: true
